# Local secrets (gitignored) — overrides whatsapp.access-token etc. Falls back silently if absent.
spring.config.import=optional:application-local.properties

# Server
server.port=${PORT:8080}
# Auto-logout after 30 minutes with no requests - Tomcat expires the session, and the next
# request from that browser has no valid Authentication, so Spring Security sends it to /login.
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json
server.compression.min-response-size=1024

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/empdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=3071

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Party Excel Import
party.import.on-startup=false
party.excel.path=Party_wise_Sales_Summary.xlsx
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# Thymeleaf
# Cache ON is the production setting: without it every request re-resolves and re-parses the
# template from the classpath. Local dev overrides this back to false in
# application-local.properties (gitignored), so template hot-reload still works on your machine.
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Connection / thread pools — sized for a low-traffic internal app on a 512 MB instance.
# Defaults (200 Tomcat threads, 10 DB connections) are far larger than this app needs and cost
# memory; a smaller pool is also kinder to Neon's connection limits.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Logging
# INFO in production; local dev overrides back to DEBUG in application-local.properties.
# Actual pattern/appender config (async, console-only, %X{traceId}) lives in logback-spring.xml,
# not here - this property just controls this package's verbosity within that setup.
logging.level.com.empmgmt=INFO

# Error handling — CustomErrorController (implements ErrorController) renders every 4xx/5xx via
# templates/error.html instead of Spring Boot's default Whitelabel page. These two properties are
# a defensive backstop, not the real guard (CustomErrorController never puts a message/stacktrace
# into the model to begin with) - they make sure that stays true even if Boot's own error
# attributes are ever read directly by something else.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ── Initial user seeding (DataSeeder, only runs once against an empty users table) ─────────────
# Set real values in application-local.properties (gitignored). Falls back to placeholders that
# won't match anything you'd guess, so the app still boots cleanly without the local file.
# seed.admin-password=
# seed.employee-password=

# ── WhatsApp Business Cloud API ────────────────────────────────────────────────
# mode: LOG_ONLY (default, simulates sends) | LIVE (calls Meta API for real)
whatsapp.mode=LIVE
# Real token lives in application-local.properties (gitignored, not committed) — set it there:
whatsapp.access-token=
# Your WhatsApp Business phone number ID from Meta dashboard:
whatsapp.phone-number-id=1172787229255136
# Approved template name (register on Meta Business Manager):
#whatsapp.template-name=payment_reminder
whatsapp.template-name=hello_world
#whatsapp.template-language=en
whatsapp.template-language=en_US
